spring:
  application:
    name: ReaderAssisstant

  datasource:
    url: jdbc:postgresql://localhost:5432/reader_assistant
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
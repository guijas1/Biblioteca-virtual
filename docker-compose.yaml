services:
  postgres:
    image: postgres:17
    container_name: biblioteca-teste
    environment:
      POSTGRES_DB: reader_assistant
      POSTGRES_USER: guijas1
      POSTGRES_PASSWORD: 3437
    ports:
      - "${DB_PORT}:5432"
